name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: 生成 Android 工程（不覆盖已有文件）
        run: |
          flutter create --platforms=android --org com.quizmaster --project-name quiz_master .
          git checkout -- pubspec.yaml lib 2>/dev/null || true

      - name: 应用自定义图标
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="android_res/mipmap-$dpi"
            dst="android/app/src/main/res/mipmap-$dpi"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp "$src"/*.png "$dst/"
            fi
          done
          sed -i 's/android:label="quiz_master"/android:label="刷题本"/' \
            android/app/src/main/AndroidManifest.xml || true

      - name: 配置固定签名
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=quizmaster2026
          keyPassword=quizmaster2026
          keyAlias=quiz
          storeFile=quiz-release.jks
          EOF

          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()

          # 1) 顶部注入 keystoreProperties 读取
          if "keystorePropertiesFile" not in s:
              inject_head = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              # 在 "android {" 前插入（只在第一次出现处）
              s = s.replace("android {", inject_head + "android {", 1)

          # 2) 定义 release signingConfig（插在 buildTypes 之前）
          if "signingConfigs.release" not in s:
              rel_cfg = """signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                  storePassword keystoreProperties['storePassword']
              }
          }
          """
              s = s.replace("    buildTypes {", rel_cfg + "    buildTypes {", 1)

          # 3) release 块改用 release 签名（模板写法: signingConfig = signingConfigs.debug）
          s = s.replace("signingConfig = signingConfigs.debug",
                        "signingConfig = signingConfigs.release")

          open(p, "w").write(s)
          print("=== 注入后 buildTypes 段 ===")
          import re as _re
          m = _re.search(r"buildTypes \{[\s\S]*?\n    \}", s)
          print(m.group(0) if m else "NOT FOUND")
          assert "signingConfigs.release" in s, "注入失败！"
          print("gradle sign config OK")
          PY

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 release APK（固定签名）
        run: flutter build apk --release

      - name: 校验签名一致性
        run: |
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | tail -1)/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk quiz-master.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quiz-master-apk
          path: quiz-master.apk
          retention-days: 30

      - name: 发布到 Releases（可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 刷题本 最新版
          body: |
            九年级文科刷题 App（道法 / 历史 / 语文 / 化学）
            固定签名版本：覆盖安装不再丢失做题记录。
          files: quiz-master.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
