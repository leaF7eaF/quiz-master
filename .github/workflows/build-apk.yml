name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.3'
          cache: true

      - name: 生成 Android 工程（不覆盖已有文件）
        run: |
          flutter create --platforms=android --org com.quizmaster --project-name quiz_master .
          git checkout -- pubspec.yaml lib 2>/dev/null || true

      - name: 应用自定义图标
        run: |
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            src="android_res/mipmap-$dpi"
            dst="android/app/src/main/res/mipmap-$dpi"
            if [ -d "$src" ]; then
              mkdir -p "$dst"
              cp "$src"/*.png "$dst/"
            fi
          done
          # 应用名
          sed -i 's/android:label="quiz_master"/android:label="刷题本"/' \
            android/app/src/main/AndroidManifest.xml || true

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 release APK
        run: flutter build apk --release

      - name: 重命名 APK
        run: cp build/app/outputs/flutter-apk/app-release.apk quiz-master.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quiz-master-apk
          path: quiz-master.apk
          retention-days: 30

      - name: 发布到 Releases（可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 刷题本 最新版
          body: |
            九年级文科刷题 App（道法 / 历史 / 语文 / 化学）
            下载下方 apk 文件安装即可。
          files: quiz-master.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
